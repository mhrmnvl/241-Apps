name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Lint · Type-check · Build (all apps)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm via Corepack
        run: |
          corepack enable
          # Match the version that wrote the lockfile (see package.json
          # "packageManager"). pnpm 10+ reads `overrides` from pnpm-workspace.yaml;
          # pnpm 9 reads it from package.json, which mismatches the lockfile.
          corepack prepare pnpm@11.11.0 --activate

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Type check & Build
        run: pnpm run build

      - name: Security audit
        run: pnpm audit --prod || true
