name: Continuous Integration

# `dev` is where work lands and `main` is production, so both are checked —
# `develop` was listed here and has never existed, so half of this ran nowhere.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: continuous-integration-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Frontend · lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm via Corepack
        run: |
          corepack enable
          # Match the version that wrote the lockfile (see package.json
          # "packageManager"). pnpm 10+ reads `overrides` from pnpm-workspace.yaml;
          # pnpm 9 reads it from package.json, which mismatches the lockfile.
          corepack prepare pnpm@11.11.0 --activate

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      # Type-aware lint, which catches a different class of defect from the
      # syntactic pass above and was not running here at all.
      - name: Lint (type-aware)
        run: pnpm run lint:strict

      - name: Type check
        run: pnpm run typecheck

      # `pnpm test` covers the five apps and @241/{shared,platform,master-data}.
      # These existed and ran only on developers' machines, which is the same as
      # not having them: nothing stopped a merge that broke one.
      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

  # The backend was absent from CI entirely — not linted, not type-checked, not
  # tested, not built. Its 1,900+ tests ran only locally, and a change that broke
  # it reached the deploy script before anything noticed. It has its own tooling
  # (jest, its own ESLint configs), so it gets its own job rather than being
  # bolted onto the frontend one.
  backend:
    name: Backend · lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Most steps here never open a connection — the unit tests mock every
    # repository — but the end-to-end suite does. `portal-public-visibility`
    # seeds rows and reads them back, which is the only way to assert that
    # unpublished content is actually absent rather than merely filtered for.
    # So this job now runs a throwaway Postgres, and the URL below points at it.
    env:
      # `sslmode=disable` is load-bearing, not decoration. The adapters in this
      # repository ask for TLS by default because the school's Postgres
      # requires it, and asking a server that has none answers `P1011
      # TlsConnectionError` — which reads like a certificate problem and is
      # really "there is no TLS here". A container has none.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?sslmode=disable
      # `ConfigModule` resolves this in specs that boot a module graph
      # reaching auth. The value is a fixture, not a credential.
      JWT_SECRET: ci-jwt-secret-for-e2e-testing-minimum-32-characters

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        # Without the health check the first migration races the server's
        # startup and fails on connection rather than on anything real.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.11.0 --activate

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Every backend step needs the generated client.
      - name: Generate Prisma client
        run: pnpm --filter backend prisma:generate

      - name: Check formatting
        run: pnpm --filter backend format:check

      - name: Lint
        run: pnpm --filter backend lint

      - name: Lint (type-aware)
        run: pnpm --filter backend lint:strict

      - name: Type check
        run: pnpm --filter backend typecheck

      - name: Test
        run: pnpm --filter backend test

      # `portal-public-visibility` needs a schema to seed into, and one user to
      # author its fixtures with — it fails fast rather than inventing one.
      # `seed:admin-minimal` is the smallest seed that satisfies that: one
      # account and the SUPER_ADMIN role, nothing else.
      - name: Apply migrations
        run: pnpm --filter backend prisma:deploy

      - name: Seed the minimum the e2e suite needs
        run: pnpm --filter backend seed:admin-minimal

      # The whole end-to-end suite, including the database-backed sweep.
      #
      # It ran nowhere before, and it showed: three suites had been failing on
      # any checkout without a `backend/.env`, one of them the ADR-0008
      # authorization net, and nothing reported it.
      - name: Test (e2e)
        run: pnpm --filter backend test:e2e

      - name: Build
        run: pnpm --filter backend build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Advisory, and honest about it: this reports rather than blocks, because a
    # transitive advisory with no fix available should not stop a school from
    # shipping. It used to hide inside the build job behind `|| true`, where
    # nobody would ever read it.
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.11.0 --activate

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod
