name: Deploy to Development

# The development environment: everything merged to `dev` lands here first.
#
# A separate workflow rather than a branch condition inside the production one,
# so the two cannot share a secret, an environment gate, or a concurrency slot
# by accident. The only thing they have in common is the shape of the script.
on:
  push:
    branches: [dev]
  workflow_dispatch: {} # allow manual re-runs from the Actions tab

# Its own group, so a dev deploy never queues behind a production one — and
# never cancels mid-flight either, since a half-applied deploy is worse than a
# queued one.
concurrency:
  group: deploy-development
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Gate behind the "development" environment. Create it in Settings →
    # Environments and put DEV_HOST / DEV_USERNAME / DEV_SSH_KEY there, not in
    # repository-wide secrets: an environment secret cannot be read by the
    # production job, which is the point of separating them.
    environment: development

    # Passed into the SSH session below via the action's `envs` input, so the
    # dev box can live somewhere other than production's path.
    env:
      DEV_APP_PATH: ${{ secrets.DEV_APP_PATH }}

    steps:
      # Fails the run rather than letting `appleboy/ssh-action` fall back to an
      # empty host, which reads as a connection error and sends a reader looking
      # at the network instead of at the missing secret.
      - name: Verify dev secrets are configured
        env:
          DEV_HOST: ${{ secrets.DEV_HOST }}
          DEV_USERNAME: ${{ secrets.DEV_USERNAME }}
          DEV_SSH_KEY: ${{ secrets.DEV_SSH_KEY }}
        run: |
          missing=""
          [ -z "$DEV_HOST" ] && missing="$missing DEV_HOST"
          [ -z "$DEV_USERNAME" ] && missing="$missing DEV_USERNAME"
          [ -z "$DEV_SSH_KEY" ] && missing="$missing DEV_SSH_KEY"
          if [ -n "$missing" ]; then
            echo "Missing secrets in the 'development' environment:$missing"
            echo "Set them under Settings → Environments → development."
            exit 1
          fi

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ${{ secrets.DEV_USERNAME }}
          key: ${{ secrets.DEV_SSH_KEY }}
          port: ${{ secrets.DEV_PORT || 22 }}
          version: 1.8.2 # pin drone-ssh for reproducible runs
          timeout: 60s # connection timeout — fail fast if the host is unreachable
          command_timeout: 30m # headroom for install + prisma + build
          # No `script_stop` — appleboy/ssh-action@v1 does not accept it and
          # warns on every run that the input is unknown. The script's own
          # `set -euo pipefail` is what actually aborts on the first failure.
          envs: DEV_APP_PATH
          script: |
            set -euo pipefail
            echo "==> Starting dev deployment..."

            cd "${DEV_APP_PATH:-/var/www/241-Apps}"

            # Server working tree is disposable — reset to origin/dev rather
            # than `git pull`, so a dirty tree or diverged history never blocks a
            # deploy. .env / .env.* are gitignored, so the box's own secrets are
            # untouched.
            git fetch --all --prune
            git reset --hard origin/dev

            pnpm install --frozen-lockfile

            # Migrations first, before anything is published.
            #
            # This used to run after the frontend builds, and that ordering is
            # what left production serving a new frontend against an old backend
            # for a day: bad database credentials aborted the script only after
            # the five *-web builds had already overwritten what Nginx serves.
            # The step most likely to fail on configuration now fails before any
            # of it is replaced.
            cd backend
            pnpm prisma:generate
            pnpm prisma:deploy
            pnpm build
            cd ..

            # Frontend: built in development mode, which does two things —
            # loads apps/<app>/.env.development (the dev API host) and writes to
            # dist-dev instead of dist, so this deploy cannot overwrite what a
            # production build on the same machine produced.
            #
            # The flag goes straight after the script name. `build -- --mode
            # development` looks right and is not: pnpm swallows the separator,
            # vite never sees the flag, and the build lands in dist against the
            # production API — silently, with a zero exit code.
            pnpm -r --filter "*-web" build --mode development

            cd backend
            pm2 restart backend-241-dev --update-env || pm2 start dist/src/main.js --name backend-241-dev
            pm2 save
            pm2 status

            echo "==> Dev deployment completed successfully!"
