name: Continuous Integration (Frontend)

# Split out of `ci.yml` so it can be skipped.
#
# GitHub's `paths` filter is a workflow-level trigger, not a per-job condition,
# so a job can only be made conditional by living in its own file. This one is
# the expensive half — around eight minutes against the backend's four and a
# half — and a backend-only change has nothing for it to check. On a private
# repository the Actions quota is finite, and this job was spending it on
# commits that could not affect the five apps.
#
# The paths below are deliberately generous. Missing a trigger means shipping an
# unchecked frontend, while an unnecessary run only costs minutes, so anything
# shared between the two halves — the lockfile, the workspace file, the root
# manifest — appears here *and* in `ci.yml`.
#
# One trap worth knowing before branch protection is ever switched on: a check
# skipped by a `paths` filter never reports, and a *required* check that never
# reports blocks the pull request forever. If required checks are added later,
# these two workflows need a merge-queue-friendly arrangement rather than a
# plain paths filter.
on:
  push:
    branches: [main, dev]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig*.json'
      - 'eslint.config.*'
      - 'lint-staged.config.cjs'
      - '.github/workflows/ci-frontend.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig*.json'
      - 'eslint.config.*'
      - 'lint-staged.config.cjs'
      - '.github/workflows/ci-frontend.yml'

concurrency:
  group: continuous-integration-frontend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Frontend · lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm via Corepack
        run: |
          corepack enable
          # Match the version that wrote the lockfile (see package.json
          # "packageManager"). pnpm 10+ reads `overrides` from pnpm-workspace.yaml;
          # pnpm 9 reads it from package.json, which mismatches the lockfile.
          corepack prepare pnpm@11.11.0 --activate

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      # Type-aware lint, which catches a different class of defect from the
      # syntactic pass above and was not running here at all.
      - name: Lint (type-aware)
        run: pnpm run lint:strict

      - name: Type check
        run: pnpm run typecheck

      # `pnpm test` covers the five apps and @241/{shared,platform,master-data}.
      # These existed and ran only on developers' machines, which is the same as
      # not having them: nothing stopped a merge that broke one.
      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build
