name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT || 22 }}
          script: |
            set -e

            echo "Starting deployment..."

            cd /var/www/241-Apps

            git pull origin main

            pnpm install --frozen-lockfile

            cd backend

            pnpm prisma:generate
            pnpm prisma:deploy

            pnpm build

            pm2 restart backend-241 --update-env || pm2 start dist/src/main.js --name backend-241

            pm2 save
            pm2 status

            cd ..

            pnpm build

            echo "Deployment completed successfully!"