name: Setup VPS SSH Key

# Temporary. Delete this file once the key is installed.
#
# It exists to authorise one public key on the VPS without touching
# deploy-dev.yml, which should stay a deploy workflow and nothing else. Manual
# trigger only — it never runs on a push.
#
# Named for the machine, not for `dev`. One VPS hosts both environments, so a
# key installed here reaches production as well — there is no "dev-only" access
# to grant while the two share a box, and calling the key `241-dev-agent` would
# have implied a boundary that does not exist.
#
# It connects with the repository-level HOST / USERNAME / SSH_KEY, not with
# DEV_*. Those four have existed since July and are what every successful deploy
# has used, so this workflow needs nothing configured before it can run — which
# matters, because GitHub secrets are write-only: copying them into an
# environment means retyping values nobody can read back.
#
# The key below is public and safe to commit; the private half never leaves the
# machine that generated it. To revoke access later, one line on the box:
#
#   sed -i '/241-vps-agent/d' ~/.ssh/authorized_keys
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest

    steps:
      - name: Verify VPS secrets are configured
        env:
          HOST: ${{ secrets.HOST }}
          USERNAME: ${{ secrets.USERNAME }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          missing=""
          [ -z "$HOST" ] && missing="$missing HOST"
          [ -z "$USERNAME" ] && missing="$missing USERNAME"
          [ -z "$SSH_KEY" ] && missing="$missing SSH_KEY"
          if [ -n "$missing" ]; then
            echo "Missing repository secrets:$missing"
            echo "Set them under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Install SSH public key
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT || 22 }}
          version: 1.8.2
          timeout: 60s
          script_stop: true
          script: |
            set -euo pipefail

            PUBKEY='ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJlufWsCfDaT0PojWUmnuj2LB4CE4XY0GDCHD1pEPDNl 241-vps-agent'

            # $HOME, not a hardcoded /root. The key has to land in the home
            # directory of whichever account DEV_USERNAME names — writing it to
            # /root when the deploy user is someone else installs a key nobody
            # can use, and the run still reports success.
            SSH_DIR="$HOME/.ssh"
            AUTH="$SSH_DIR/authorized_keys"

            mkdir -p "$SSH_DIR"
            chmod 700 "$SSH_DIR"
            touch "$AUTH"
            chmod 600 "$AUTH"

            # Idempotent: re-running must not append a second copy.
            if grep -qxF "$PUBKEY" "$AUTH"; then
              echo "Key already present — nothing to do."
            else
              echo "$PUBKEY" >> "$AUTH"
              echo "Key added."
            fi

            # Report what actually landed, rather than trusting that it did.
            # sshd refuses a key whose directory or file is group/other-writable,
            # and that failure looks like "permission denied" at connect time —
            # far from here, and easy to misread as the wrong key.
            echo "--- verification ---"
            echo "user      : $(id -un) (uid $(id -u))"
            echo "home      : $HOME"
            echo "perms     : $(stat -c '%a %n' "$SSH_DIR") | $(stat -c '%a %n' "$AUTH")"
            echo "matching  : $(grep -cxF "$PUBKEY" "$AUTH") entry/entries"
            echo "fingerprint:"
            grep -xF "$PUBKEY" "$AUTH" | ssh-keygen -lf - || true
