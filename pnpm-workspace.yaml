packages:
  - apps/*
  - packages/*
  - backend

# Force a single TypeScript version across the workspace. Two TS versions make
# pnpm create two peer-flavored copies of vue/pinia/vue-router, which can lead to
# duplicate runtime instances (e.g. Pinia's "reading '_s' of undefined"). One TS
# ⇒ one flavor. (pnpm 11 reads overrides here, not from package.json.)
overrides:
  typescript: 5.8.3

  # Transitive advisories, pinned to their patched line.
  #
  # Every one of these is a leaf utility reached through a dependency we do not
  # control — `pnpm audit --prod` reports them and no direct upgrade clears them,
  # because the intermediate package has not published a release that moves its
  # own floor. An override is the only lever, and it is a safe one here: each is
  # a patch or minor bump within the same major, on a package with no API surface
  # of ours touching it.
  #
  # Remove an entry once the parent catches up — an override that is no longer
  # doing anything is a pin nobody remembers agreeing to.
  # Scoped per major, not pinned across both. An unscoped `^2.1.4` forces v2
  # onto v1's consumers, and the two are not interchangeable: v1 exports the
  # function itself, v2 exports `{ expand }`. ESLint reaches v1 through minimatch
  # and dies with "brace_expansion_1.expand is not a function". Both majors had
  # their own advisory, so both get their own floor.
  'brace-expansion@1': ^1.1.18 # DoS via unbounded expansion (vite → stylus → glob)
  'brace-expansion@2': ^2.1.4 # same, other major (exceljs → archiver)
  fast-uri: ^3.1.5 # host confusion via backslash authority (vue-router → unplugin)
  js-yaml: ^5.2.2 # exponential parse time in flow collections (@nestjs/swagger)
  nanoid: ^3.3.17 # custom generators can loop indefinitely (postcss)
  postcss: ^8.5.23 # incomplete fix of GHSA-6g55-p6wh-862q (vite, @vue/compiler-sfc)

  # Reached through `prisma → @prisma/dev`, which is the CLI's own dev server —
  # the migration and generate commands the deploy runs never touch it. Pinned
  # anyway, because `prisma` sits in dependencies (the server needs the CLI to
  # migrate), so the advisories are reported against production.
  hono: ^4.12.34 # ReDoS in CORS middleware, and three more
  '@hono/node-server': ^1.19.15 # path traversal in serve-static
  valibot: ^1.4.2 # record() paths can make flatten() throw
  # The two major bumps here, and the only entries that could plausibly break
  # something. Both are verified by running the thing they could break, not by
  # reading the diff.
  #
  # exceljs declares uuid ^8 and this forces 11. A workbook writes and reads
  # back, and the student export suite passes. That export has been broken once
  # before by a change that compiled cleanly, which is why it is checked by
  # running it.
  uuid: ^11.1.1 # missing buffer bounds check in v3/v5/v6 (exceljs)

  # `@prisma/config` does not declare a range for this — it pins the exact
  # 7.1.5 — so the override overrules a deliberate pin rather than widening a
  # floor. It is reached by every Prisma CLI command, because loading
  # prisma.config.ts is what @prisma/config is for, so `generate` and `migrate`
  # are the things at risk and the things that get run to check it.
  #
  # v8 is not a pure security patch: Map values are deep-merged where they were
  # replaced, and `deepmergeInto` stopped leak-mutating its inputs. Prisma
  # merges plain config objects, so neither reaches it — verified by generating
  # the client and diffing a migration against the schema, both of which load
  # the config through this package.
  deepmerge-ts: ^8.0.0 # stack exhaustion on recursive graphs (prisma → @prisma/config)

allowBuilds:
  esbuild: true
  vue-demi: true
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': true
  bcrypt: true
  prisma: true
  puppeteer: true
  unrs-resolver: true
  maplibre-gl: true
  sharp: true
